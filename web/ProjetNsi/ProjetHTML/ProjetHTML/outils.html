<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Outils | Smartlife</title>
    <link rel="stylesheet" href="style1.css" />
    <link
      rel="icon"
      type="image/jpg"
      href="images/Firefly_RemoveBackground.png"
    />
  </head>
  <body>
    <!--Barre de navigation pour se déplacer entre les pages-->
    <nav class="barre-navigation">
      <ul>
        <li>
          <a href="accueil.html"
            ><img src="images/Firefly_RemoveBackground.png" alt=""
          /></a>
          <h1 id="titre">Smartlife</h1>
        </li>
        <li><a href="accueil.html">Accueil</a></li>
        <li><a href="outils.html">Outils</a></li>
        <li><a href="a-propos.html">À propos</a></li>
      </ul>
    </nav>

    <main class="grille-outils">
      <!-- Panneau de la calculatrice -->
      <section class="panneau">
        <h2>Calculatrice</h2>
        <!--Écran où le calcul est affiché-->
        <div id="zone-calculatrice">
          <input id="affichage" readonly />

          <!--Boutons pour écrire les nombres et les opérations-->
          <div id="clavier">
            <button onclick="effaceraffichage()" class="operator-btn">C</button>
            <button onclick="ajouteraffichage('(')">(</button>
            <button onclick="ajouteraffichage(')')">)</button>
            <button onclick="ajouteraffichage('**')" class="operator-btn">
              ^
            </button>
            <button onclick="ajouteraffichage('/')" class="operator-btn">
              /
            </button>

            <button onclick="ajouteraffichage('7')">7</button>
            <button onclick="ajouteraffichage('8')">8</button>
            <button onclick="ajouteraffichage('9')">9</button>
            <button onclick="ajouteraffichage('*')" class="operator-btn">
              ×
            </button>

            <button onclick="ajouteraffichage('4')">4</button>
            <button onclick="ajouteraffichage('5')">5</button>
            <button onclick="ajouteraffichage('6')">6</button>
            <button onclick="ajouteraffichage('-')" class="operator-btn">
              −
            </button>

            <button onclick="ajouteraffichage('1')">1</button>
            <button onclick="ajouteraffichage('2')">2</button>
            <button onclick="ajouteraffichage('3')">3</button>
            <button onclick="ajouteraffichage('+')" class="operator-btn">
              +
            </button>

            <button onclick="ajouteraffichage('0')">0</button>
            <button onclick="ajouteraffichage('.')">.</button>
            <button onclick="calculer()">=</button>
          </div>
        </div>
      </section>

      <!-- section du convertisseur -->
      <section class="panneau">
        <h2>Convertisseur</h2>

        <!--Formulaire qui permet de choisir le nombre et le sens de conversion-->
        <form>
          <h1>Convertisseur d'unités :</h1>
          <input type="number" id="champ-distance" value="0" /><br />

          <input type="radio" id="vers-metres" name="unite" />
          <label for="vers-metres">Kilomètres vers mètres</label><br />

          <input type="radio" id="vers-kilometres" name="unite" />
          <label for="vers-kilometres">Mètres vers kilomètres</label> <br />

          <button type="button" onclick="convertir()">Calculer</button>
          <p id="resultat"></p>
        </form>
      </section>

      <!-- panneau du budget -->
      <section class="panneau">
        <h2>Calcul de budget</h2>

        <!--Les champs pour entrer les revenues et les dépenses-->
        <form id="calcul-budget">
          <label for="revenus">Revenu total :</label>
          <input
            type="number"
            placeholder="Entrez votre revenu"
            required
            id="revenus"
          />
          <label for="depenses">Dépenses totales :</label>
          <input
            type="number"
            placeholder="Entrez vos dépenses"
            required
            id="depenses"
          />
          <!--le budget restant s'affiche ici-->
          <div class="resultat-budget">
            <h2>Votre budget restant : <span id="budget-restant">0€</span></h2>
          </div>
        </form>
      </section>

      <!-- liste des tâches -->
      <section class="panneau">
        <h2>Gestion des tâches</h2>

        <!--Zone pour ajouter et afficher les tâches de la liste-->
        <div class="gestionnaire-taches">
          <div class="ligne">
            <input type="text" id="champ-tache" placeholder="Tâche" />
            <button id="bouton-ajouter-tache" onclick="ajoutertache()">Ajouter</button>
          </div>
          <ul id="liste-taches"></ul>
        </div>
      </section>
    </main>

    <!--Lien vers le script qui fait fonctionner les outils-->
    <script src="script.js"></script>
  </body>
</html>
