<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Antoine</title>
    <link rel="stylesheet" href="contenu.css">
    <link rel="icon" href="ressources/balle_icone.png">
    
    
</head>

<body>

    <header>
        <nav class="navbar">
            <ul class="nav-links">
                <li><a href="index.html">Accueil</a></li>
                <li><a href="regles.html">Règles</a></li>
                <li><a href="tournois.html">Tournois</a></li>
                <img src="ressources/balle_icone.png" alt="icone tennis" class="icone">
            </ul>
        </nav>
    </header>
    <main>
    <div class="col1">
        <div class="ligne1">
            <h1 class="titre">
                <u>Bienvenue ...</u>
            </h1>
            <p class="intro">
                Antoine, élève de 1°4 au Lycée Turgot.<br>
                Ma passion est le tennis et ce site sera consacré à ce sport.
                Dans ce site, vous trouverez des règles du tennis et des informations sur les tournois majeurs.
            </p>
        </div>

        <div class="ligne2">
            <h1>Commentaires</h1>
            <form>
                <label for="prenom">Prénom</label>
                <input type="text" id="prenom" placeholder="Votre prénom">

                <label for="nom">Nom</label>
                <input type="text" id="nom" placeholder="Votre nom">

                <label>Sexe</label>
                <div class="radios">
                    <input type="radio" id="homme" name="sexe" value="Homme"><label for="homme">Homme</label>
                    <input type="radio" id="femme" name="sexe" value="Femme"><label for="femme">Femme</label>
                </div>

                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Votre e-mail">
                <label for="commentaire">Commentaires</label>
                <input type="text" placeholder="Améliorations,conseils,..." id="commentaire">
                <button type="submit">Envoyer</button>




            </form>



        </div>

    </div>

    <div class="col2">
        <img src="ressources/tennis_court.jpg" alt="Tennis court image">

    </div>
    </main>
    

</body>
</html>
