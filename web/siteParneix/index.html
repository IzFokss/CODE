<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Antoine</title>
    <link rel="stylesheet" href="contenu.css">
    <link rel="icon" href="ressources/balle_icone.png">
    
    
    
</head>

<body>

    <!-- ========== HEADER ET NAVIGATION ========== -->
    <!-- Barre de navigation fixe en haut du site avec liens vers Accueil, Règles et Tournois -->
    <header>
        <nav class="navbar">
            <ul class="nav-links">
                <li><a href="index.html" class="active">Accueil</a></li>
                <li><a href="regles.html">Règles</a></li>
                <li><a href="tournois.html">Tournois</a></li>
            </ul>
            <!-- Icône cliquable redirigeant vers Wikipedia Tennis -->
            <a href="https://fr.wikipedia.org/wiki/Tennis"><img src="ressources/balle_icone.png" alt="icone tennis" class="icone"></a>
        </nav>
    </header>
    <!-- Titre principal personnalisé par le formulaire -->
    <h1 class="titre">Bonjour, cher visiteur !</h1>
    <!-- ========== CONTENU PRINCIPAL ========== -->
    <!-- Page d'accueil avec 2 colonnes : Présentation/Formulaire et Image -->
    <main class="accueil">
        <!-- Colonne 1 : Section présentation et formulaire de contact -->
        <div class="col1">
            <!-- Section Présentation avec description d'Antoine et du site -->
            <div class="ligne1">
                <h1>Présentation</h1>
                <p class="intro">
                    Antoine, élève de 1°4 au Lycée Turgot.<br>
                    Ma passion est le tennis et ce site sera consacré à ce sport.
                    Dans ce site, vous trouverez des règles du tennis et des informations sur les tournois majeurs.
                </p>
            </div>

            <!-- Section Formulaire de contact avec validation JavaScript -->
            <div class="ligne2">
                <h1>Formulaire</h1>
                <form>
                    <label for="prenom">Prénom</label>
                    <input type="text" id="prenom" placeholder="Votre prénom">

                    <label for="nom">Nom</label>
                    <input type="text" id="nom" placeholder="Votre nom">

                    <!-- Options Homme/Femme -->
                    <label>Sexe</label>
                    <div class="radios">
                        <input type="radio" id="H" name="sexe" value="Homme"><label for="H">Homme</label>
                        <input type="radio" id="F" name="sexe" value="Femme"><label for="F">Femme</label>
                    </div>

                    <button type="submit">Envoyer</button>
                </form>
            </div>
        </div>

        <!-- Colonne 2 : Image du terrain de tennis -->
        <div class="col2">
            <img src="ressources/tennis_court.jpg" alt="Tennis court image">
        </div>
    </main>
    

</body>
<script src="script.js"></script>
</html>
